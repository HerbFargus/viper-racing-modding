<title>Cats vs Dogs Cars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a garage turntable viewport with a car picker beside it, spec sheets for both cars underneath */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#1b2430; --muted:#5d6b7a; --line:#d5dce4;
  --dog:#c8462f; --cat:#7a4fc0; --accent:#d9822b; --accent-ink:#ffffff; --view:#dfe5ec; --grid:#b9c3cf; --code:#f4f6f8;
  --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --panel:#1a2129; --ink:#e6ebf0; --muted:#94a2b1; --line:#2c3642;
  --dog:#ec6f57; --cat:#a684e6; --accent:#e8964a; --accent-ink:#1a1209; --view:#0f1419; --grid:#2e3a47; --code:#141a21; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --panel:#1a2129; --ink:#e6ebf0; --muted:#94a2b1; --line:#2c3642;
  --dog:#ec6f57; --cat:#a684e6; --accent:#e8964a; --accent-ink:#1a1209; --view:#0f1419; --grid:#2e3a47; --code:#141a21; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 40px}
header{margin-bottom:14px}
h1{font-family:var(--display);font-weight:700;font-size:1.8rem;margin:0;text-wrap:balance}
h1 .d{color:var(--dog)} h1 .c{color:var(--cat)}
header p{margin:4px 0 0;color:var(--muted);max-width:72ch}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.view{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;aspect-ratio:16/10;max-width:100%;background:var(--view)}
.view canvas{display:block;width:100%;height:100%;cursor:grab}
.hud{position:absolute;left:10px;top:8px;font:12px var(--mono);color:var(--muted);pointer-events:none}
.controls{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:10px}
.controls label{display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
.pick{display:flex;flex-direction:column;gap:6px}
.pick h2,.card h2{font:700 .8rem var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 4px}
.pk{display:grid;gap:2px;text-align:left;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:9px 11px;cursor:pointer;font:inherit}
.pk b{font-family:var(--display);font-weight:500;font-size:1.05rem}
.pk span{font-size:13px;color:var(--muted)}
.pk.cat b{color:var(--cat)} .pk.dog b{color:var(--dog)}
.pk[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.specs{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0}
.card h3{font:700 1.25rem var(--display);margin:0}
.card.cat h3{color:var(--cat)} .card.dog h3{color:var(--dog)}
.card .sub{color:var(--muted);font-size:14px;margin:2px 0 10px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
dt{color:var(--muted)} dd{margin:0}
dd.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card ul{padding-left:18px;margin:8px 0 0} .card li{font-size:14px;color:var(--muted);margin:3px 0}
</style>

<div class="wrap">
  <header>
    <h1><span class="c">Alley Cat</span> &amp; <span class="d">Doghouse</span></h1>

<script>
// ---------- mesh builder (same as the pet and track mockups) ----------
function Builder(){this.pos=[];this.col=[];}
Builder.prototype.tri=function(a,b,c,col){for(const p of[a,b,c]){this.pos.push(p.x,p.y,p.z);this.col.push(col.r,col.g,col.b);}};
Builder.prototype.quad=function(a,b,c,d,col){this.tri(a,b,c,col);this.tri(a,c,d,col);};
function xf(o){const m=new THREE.Matrix4();const r=o.rot||(Array.isArray(o.r)?o.r:[0,0,0]);
  m.compose(new THREE.Vector3(...o.at),new THREE.Quaternion().setFromEuler(new THREE.Euler(r[0],r[1],r[2])),new THREE.Vector3(1,1,1));return m;}
Builder.prototype.box=function(o){
  const[w,h,d]=o.s,[tx,tz]=o.top||[1,1],[sx,sz]=o.sh||[0,0],m=xf(o),col=new THREE.Color(o.c);
  const V=(x,y,z)=>new THREE.Vector3(x,y,z).applyMatrix4(m);
  const b=[V(-w/2,-h/2,-d/2),V(w/2,-h/2,-d/2),V(w/2,-h/2,d/2),V(-w/2,-h/2,d/2)];
  const t=[V(-w*tx/2+sx,h/2,-d*tz/2+sz),V(w*tx/2+sx,h/2,-d*tz/2+sz),V(w*tx/2+sx,h/2,d*tz/2+sz),V(-w*tx/2+sx,h/2,d*tz/2+sz)];
  this.quad(t[0],t[3],t[2],t[1],col);this.quad(b[0],b[1],b[2],b[3],col);
  this.quad(b[3],b[2],t[2],t[3],col);this.quad(b[1],b[0],t[0],t[1],col);
  this.quad(b[2],b[1],t[1],t[2],col);this.quad(b[0],b[3],t[3],t[0],col);};
Builder.prototype.pyr=function(o){
  const[w,h,d]=o.s,[ax,az]=o.apex||[0,0],m=xf(o),col=new THREE.Color(o.c);
  const V=(x,y,z)=>new THREE.Vector3(x,y,z).applyMatrix4(m);
  const b=[V(-w/2,0,-d/2),V(w/2,0,-d/2),V(w/2,0,d/2),V(-w/2,0,d/2)],a=V(ax,h,az);
  this.quad(b[0],b[1],b[2],b[3],col);
  this.tri(b[3],b[2],a,col);this.tri(b[1],b[0],a,col);this.tri(b[2],b[1],a,col);this.tri(b[0],b[3],a,col);};
Builder.prototype.cyl=function(o){
  const n=o.n||8,r=o.r,r2=o.r2??o.r,h=o.h,m=xf(o),col=new THREE.Color(o.c),col2=new THREE.Color(o.c2||o.c);
  const V=(x,y,z)=>new THREE.Vector3(x,y,z).applyMatrix4(m);
  const B=[],T=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;B.push(V(Math.cos(a)*r,0,Math.sin(a)*r));T.push(V(Math.cos(a)*r2,h,Math.sin(a)*r2));}
  const cb=V(0,0,0),ct=V(0,h,0);
  for(let i=0;i<n;i++){const j=(i+1)%n;this.quad(B[j],B[i],T[i],T[j],col);this.tri(ct,T[j],T[i],col2);this.tri(cb,B[i],B[j],col);}};
const both=f=>{f(1);f(-1);};
function geoFrom(B){const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(B.pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(B.col,3));
  g.computeVertexNormals();g.computeBoundingBox();return g;}
const tris=B=>B.pos.length/9;

// ---------- wheels: one mesh per car, built along +x (outer face), paw-print hubcap ----------
function wheel(R,W,tyre,rim,pad,n=12){const B=new Builder();
  B.cyl({at:[-W/2,0,0],rot:[0,0,-Math.PI/2],r:R,h:W,n,c:tyre});
  B.cyl({at:[W/2-.005,0,0],rot:[0,0,-Math.PI/2],r:R*.62,h:.02,n,c:rim});
  const x=W/2+.02;
  B.box({at:[x,-R*.12,0],s:[.02,R*.28,R*.34],top:[1,.7],c:pad});
  [[-.32,.18],[-.12,.34],[.12,.34],[.32,.18]].forEach(([z,y])=>B.box({at:[x,y*R,z*R],s:[.02,R*.13,R*.13],c:pad}));
  return B;}

// ---------- Alley Cat: chopped black hot rod with a cat face ----------
function alleyCat(){const B=new Builder();
  const BK='#1c1a22',BK2='#2c2834',CH='#c9cfd6',GL='#3c5866',EYE='#8dff5a',PUR='#7a4fc0',RED='#d23c2a';
  // frame and floor
  both(k=>B.box({at:[k*.45,.38,0],s:[.12,.14,4.0],c:BK2}));
  B.box({at:[0,.5,-.45],s:[1.3,.14,2.1],c:BK});
  // long hood with louvres and purple flame panels
  B.box({at:[0,.76,1.05],s:[.78,.46,1.5],top:[.92,.98],c:BK});
  both(k=>{for(let i=0;i<5;i++)B.box({at:[k*.395,.8,.6+i*.2],s:[.02,.2,.06],c:BK2});
           B.box({at:[k*.39,.66,1.2],s:[.02,.1,1.1],top:[1,.6],sh:[0,.15],c:PUR});});
  // blower and scoop sticking out of the hood
  B.box({at:[0,1.08,.85],s:[.36,.2,.5],c:CH});B.box({at:[0,1.26,.85],s:[.3,.18,.36],top:[.9,.6],sh:[0,.06],c:'#3a3a3a'});
  // cat-face grille: shield, ears, slit eyes as headlights, pink nose, whiskers
  B.box({at:[0,.78,1.83],s:[.64,.58,.1],top:[.8,1],c:BK2});
  both(k=>{B.pyr({at:[k*.2,1.07,1.83],s:[.2,.26,.1],apex:[k*.05,0],c:BK});
           B.box({at:[k*.15,.88,1.885],s:[.14,.07,.02],r:[0,0,k*.25],c:EYE});
           for(let i=0;i<3;i++)B.box({at:[k*.46,.7+i*.06,1.86],s:[.36,.015,.015],r:[0,0,k*(i-1)*.15],c:'#e8e8e8'});
           // round headlamps on stalks too, cat-eye green
           B.box({at:[k*.5,.86,1.55],s:[.05,.2,.05],c:CH});B.cyl({at:[k*.5,.98,1.48],rot:[Math.PI/2,0,0],r:.11,h:.16,n:8,c:BK,c2:EYE});});
  B.pyr({at:[0,.66,1.88],s:[.09,.07,.04],rot:[Math.PI,0,0],c:'#e59a9a'});
  // chopped cab: low body, narrow slot windows, roof ears
  B.box({at:[0,.86,-.45],s:[1.3,.6,1.5],top:[.96,.92],c:BK});
  B.box({at:[0,1.28,-.55],s:[1.18,.26,1.1],top:[.9,.82],sh:[0,-.04],c:BK});
  both(k=>B.box({at:[k*.62,1.25,-.5],s:[.02,.12,.8],c:GL}));
  B.box({at:[0,1.25,.06],s:[1.06,.12,.02],rot:[-.35,0,0],c:GL});B.box({at:[0,1.25,-1.08],s:[1.0,.12,.02],c:GL});
  both(k=>B.pyr({at:[k*.34,1.41,-.4],s:[.24,.28,.14],apex:[k*.05,0],c:BK}));
  // bobbed rear deck and cat-eye tail lights
  B.box({at:[0,.78,-1.6],s:[1.2,.42,.8],top:[.95,.8],sh:[0,.06],c:BK});
  both(k=>B.box({at:[k*.4,.86,-2.005],s:[.18,.06,.02],r:[0,0,-k*.25],c:RED}));
  // fenders: cycle fenders up front, fat tubs at the back
  both(k=>{B.box({at:[k*.78,.66,1.3],s:[.26,.06,.7],top:[1,.6],c:BK2});
           B.box({at:[k*.8,.62,-1.4],s:[.42,.5,1.0],top:[.7,.8],c:BK});});
  // side pipes
  both(k=>{B.cyl({at:[k*.7,.42,-.9],rot:[Math.PI/2,0,0],r:.06,h:1.9,n:6,c:CH});
           for(let i=0;i<4;i++)B.cyl({at:[k*.55,.62,.62+i*.12],rot:[0,0,k*1.1],r:.035,h:.25,n:5,c:CH});});
  // curling tail as the antenna: a chain of segments bending up and forward, white tip
  {let p=[.3,1.0,-1.85];const L=.26,A=[25,50,75,100,125,150];A.forEach((deg,i)=>{const t=deg*Math.PI/180,d=[0,Math.sin(t),-Math.cos(t)];
    B.box({at:[p[0],p[1]+d[1]*L/2,p[2]+d[2]*L/2],s:[.06,.06,L+.03],r:[t,0,0],c:i===A.length-1?'#e8e8e8':BK2});p=[p[0],p[1]+d[1]*L,p[2]+d[2]*L];});}
  return{body:B,wheels:[
    {at:[.77,.3,1.3],B:wheel(.3,.18,'#151515',CH,PUR)},{at:[.82,.36,-1.4],B:wheel(.36,.34,'#151515',CH,PUR)}]};}

// ---------- Doghouse: a red doghouse on a kart chassis ----------
function doghouse(){const B=new Builder();
  const RD='#c0392b',RD2='#a33024',RF='#5d4037',RF2='#4a332c',WH='#f2efe8',CH='#c9cfd6',YL='#e2c07c',TB='#d7e84a';
  // kart tray and roll bar
  B.box({at:[0,.45,0],s:[1.5,.16,3.3],c:'#3b4652'});
  both(k=>B.box({at:[k*.55,.38,0],s:[.1,.1,3.6],c:'#2b333c'}));
  // walls with plank lines
  B.box({at:[0,1.05,-.15],s:[1.5,1.05,2.2],c:RD});
  both(k=>{for(let i=0;i<4;i++)B.box({at:[k*.755,.7+i*.24,-.15],s:[.01,.03,2.2],c:RD2});});
  // gable roof, overhanging, with a ridge cap and shingle rows
  B.box({at:[0,1.95,-.15],s:[1.95,.75,2.5],top:[.04,1],c:RF});
  B.box({at:[0,2.34,-.15],s:[.14,.06,2.56],c:RF2});
  both(k=>{for(let i=0;i<3;i++)B.box({at:[k*(.28+i*.24),1.82+(2-i)*.2,-.15],s:[.02,.04,2.5],r:[0,0,-k*.72],c:RF2});});
  // front gable wall and door arch with the driver (a corgi) peeking out
  B.box({at:[0,1.95,.95],s:[1.5,.7,.06],top:[.04,1],c:RD});
  B.box({at:[0,1.0,.965],s:[.62,.8,.04],c:'#141414'});B.cyl({at:[0,1.4,.945],rot:[Math.PI/2,0,0],r:.31,h:.06,n:10,c:'#141414'});
  const O='#d9893a';
  B.box({at:[0,1.18,1.0],s:[.42,.36,.36],top:[.85,.85],c:O});B.box({at:[0,1.08,1.22],s:[.22,.18,.2],c:WH});
  B.box({at:[0,1.13,1.33],s:[.07,.06,.03],c:'#1d1a18'});
  both(k=>{B.box({at:[k*.1,1.24,1.185],s:[.05,.05,.02],c:'#1d1a18'});B.pyr({at:[k*.14,1.34,1.0],s:[.15,.3,.08],apex:[k*.03,0],c:O});});
  // name board over the door
  B.box({at:[0,1.72,.99],s:[.55,.16,.03],c:YL});
  // bone bumper with tennis-ball headlights
  B.box({at:[0,.55,1.82],s:[1.3,.16,.16],c:WH});
  both(k=>both(j=>B.cyl({at:[k*.68,.55+j*.09,1.73],rot:[Math.PI/2,0,0],r:.11,h:.18,n:8,c:WH})));
  both(k=>{B.cyl({at:[k*.42,.64,1.68],r:.05,r2:.15,h:.14,n:8,c:TB});B.cyl({at:[k*.42,.78,1.68],r:.15,r2:.05,h:.14,n:8,c:TB});});
  // dog bowl on the back deck and a fire-hydrant exhaust
  B.cyl({at:[-.35,.53,-1.55],r:.26,r2:.32,h:.16,n:10,c:CH,c2:'#8b5a2b'});
  B.cyl({at:[.4,.53,-1.55],r:.11,h:.42,n:8,c:'#d7261e'});B.cyl({at:[.4,.95,-1.55],r:.13,r2:.06,h:.1,n:8,c:'#b81f18'});
  // wagging tail antenna off the back of the roof
  [[-1.42,2.0,.4],[-1.5,2.25,.9],[-1.52,2.52,1.4]].forEach(([z,y,r])=>B.box({at:[-.3,y,z],s:[.08,.08,.32],r:[r,0,-.25],c:YL}));
  // little fenders over the chunky wheels
  both(k=>[1.15,-1.15].forEach(z=>B.box({at:[k*.88,.92,z],s:[.38,.05,.8],c:'#3b4652'})));
  return{body:B,wheels:[
    {at:[.88,.38,1.15],B:wheel(.38,.3,'#1b1b1b','#f2efe8','#c0392b',10)},{at:[.88,.38,-1.15],B:wheel(.38,.3,'#1b1b1b','#f2efe8','#c0392b',10)}]};}

// ---------- pets and horn balls ----------
const PINK='#e59a9a',BLK='#1d1a18';
function catHead(B,y,z,c,c2,muz,eye){B.box({at:[0,y,z],s:[.13,.11,.11],top:[.85,.85],c});
  B.box({at:[0,y-.025,z+.06],s:[.065,.045,.03],c:muz});B.box({at:[0,y-.008,z+.077],s:[.018,.012,.006],c:PINK});
  both(k=>{B.box({at:[k*.032,y+.015,z+.057],s:[.022,.018,.008],c:eye});B.pyr({at:[k*.042,y+.05,z-.005],s:[.045,.06,.03],apex:[k*.008,0],c:c2});});}
function midnight(){const B=new Builder(),K='#2a2930',K2='#3d3b46';
  both(k=>{B.box({at:[k*.065,.06,-.04],s:[.07,.12,.17],top:[.8,.8],c:K});B.box({at:[k*.035,.09,.075],s:[.035,.18,.035],c:K2});B.box({at:[k*.035,.01,.085],s:[.04,.02,.05],c:K2});});
  B.box({at:[0,.14,0],s:[.15,.24,.15],top:[.7,.75],r:[.2,0,0],c:K});catHead(B,.31,.06,K,K,K2,'#e8c547');
  B.box({at:[.09,.015,.03],s:[.03,.03,.14],c:K});B.box({at:[.065,.015,.12],s:[.03,.03,.08],r:[0,-1.0,0],c:K2});return B;}
function corgi(){const B=new Builder(),O='#d9893a',W='#f3ece0';
  both(k=>[.14,-.14].forEach(z=>B.box({at:[k*.06,.045,z],s:[.05,.09,.05],c:W})));
  B.box({at:[0,.15,0],s:[.2,.15,.4],top:[.9,.92],c:O});B.box({at:[0,.085,.02],s:[.16,.03,.32],c:W});B.box({at:[0,.15,.195],s:[.14,.12,.02],c:W});
  B.box({at:[0,.27,.23],s:[.15,.13,.14],top:[.85,.85],c:O});B.box({at:[0,.235,.33],s:[.08,.065,.08],top:[.85,.85],c:W});B.box({at:[0,.255,.372],s:[.025,.02,.01],c:BLK});
  both(k=>{B.box({at:[k*.04,.29,.301],s:[.018,.018,.006],c:BLK});B.pyr({at:[k*.05,.33,.22],s:[.06,.12,.035],apex:[k*.012,0],c:O});});
  B.box({at:[0,.2,-.215],s:[.04,.04,.04],c:O});return B;}
const HORN_R=.457;   // the horn ball's collision radius is an engine constant

const CARS=[
 {id:'alleycat',file:'alleycat.car',name:'Alley Cat',side:'cat',make:alleyCat,pet:midnight,petName:'Midnight',
  blurb:'Chopped black hot rod. Cat-face grille, slit green headlights, roof ears, a curling tail for an antenna.',
  hornBall:{color:0xd64561,lines:0x8e1f3a,name:'Yarn ball'},horn:'Meow (a hiss on a long press?)',
  tune:"All of Val's .cf: 350 hp, 9,000 rpm, 6 gears. The Willys recipe, which suits a Viper-sized body.",
  wb:2.7,
  notes:['Big rear tyres, skinny fronts: the .cf takes front and rear tyre sizes separately.','The paint slot (alleycat.tex) covers the black body; flames and eyes come from a small palette texture.','Cockpit cut from the body behind the chopped windscreen, so the view is through the slot.']},
 {id:'doghouse',file:'doghouse.car',name:'Doghouse',side:'dog',make:doghouse,pet:corgi,petName:'Corgi',
  blurb:'A red doghouse bolted to a kart. A corgi drives from the doorway, tennis balls for headlights, a bone for a bumper.',
  hornBall:{color:0xd7e84a,lines:0x9aa82a,name:'Tennis ball'},horn:'Bark (a woof)',
  tune:"Val's chassis, 210 hp on the tall 3.50 final drive. The Indy Jeep recipe for a heavier, taller body.",
  wb:2.3,
  notes:['Tall (2.4 m to the roof ridge; the height above includes the tail antenna): roll risk. Keep the .cf height honest and test hard corners first.','Paint slot (doghouse.tex) is the red walls, so players can repaint the house.','Cockpit view from inside the door, looking out over the corgi\'s ears.']},
];
CARS.forEach(c=>{const m=c.make();c.body=geoFrom(m.body);c.bodyTris=tris(m.body);
  c.wheelDefs=m.wheels.map(w=>({at:w.at,geo:geoFrom(w.B),tris:tris(w.B)}));
  c.wheelTris=c.wheelDefs.reduce((t,w)=>t+w.tris*2,0);
  const bb=c.body.boundingBox.clone();c.wheelDefs.forEach(w=>{const r=w.geo.boundingBox;
    both(k=>{const b=r.clone();if(k<0){const mn=b.min.x;b.min.x=-b.max.x;b.max.x=-mn;}b.translate(new THREE.Vector3(k*w.at[0],w.at[1],w.at[2]));bb.union(b);});});
  bb.min.y=0;c.bb=bb;c.size=new THREE.Vector3();bb.getSize(c.size);
  c.track=c.wheelDefs.map(w=>w.at[0]*2);
  const pg=geoFrom(c.pet());pg.scale(4,4,4);pg.computeBoundingBox();c.petGeo=pg;});

// ---------- scene ----------
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const view=document.getElementById('view');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));view.prepend(renderer.domElement);
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(35,16/10,.05,200);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=1.52;
scene.add(new THREE.HemisphereLight(0xffffff,0x5a6470,.75));const sun=new THREE.DirectionalLight(0xffffff,.75);sun.position.set(3,6,4);scene.add(sun);
const mat=new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true});
const world=new THREE.Group();scene.add(world);let grid=null;
const state={pick:'both',viper:false,pet:true,horn:true,explode:false,spin:false};
try{Object.assign(state,JSON.parse(localStorage.getItem('cvdcars')||'{}'));}catch(e){}
if(matchMedia('(prefers-reduced-motion: reduce)').matches)state.spin=false;

function carGroup(c){const g=new THREE.Group(),lift=state.explode?.9:0;
  const body=new THREE.Mesh(c.body,mat);body.position.y=lift;g.add(body);
  c.wheelDefs.forEach(w=>both(k=>{const m=new THREE.Mesh(w.geo,mat);m.position.set(k*w.at[0]*(state.explode?1.35:1),w.at[1],w.at[2]);if(k<0)m.rotation.y=Math.PI;g.add(m);}));
  if(state.horn){const hb=hornBall(c);hb.position.set(0,HORN_R,c.bb.max.z+.9);g.add(hb);}
  return g;}
function viperGhost(){const B=new Builder();B.box({at:[0,.56,0],s:[1.92,1.12,4.45],top:[.72,.45],sh:[0,-.4],c:'#999'});
  const g=geoFrom(B),grp=new THREE.Group();
  grp.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:0xa83232,transparent:true,opacity:.3})),new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:0xa83232})));return grp;}
function hornBall(c){const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.IcosahedronGeometry(HORN_R,1),new THREE.MeshLambertMaterial({color:c.hornBall.color,flatShading:true})));
  g.add(new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(HORN_R*1.01,2)),new THREE.LineBasicMaterial({color:c.hornBall.lines})));
  return g;}
function rebuild(){world.clear();if(grid)scene.remove(grid);
  const list=state.pick==='both'?CARS:CARS.filter(c=>c.id===state.pick);let x=0,minX=0,maxX=0,maxH=0;
  const items=[];
  list.forEach(c=>{items.push({obj:carGroup(c),w:c.size.x,h:c.size.y});
    if(state.pet){const p=new THREE.Mesh(c.petGeo,mat);p.position.y=-c.petGeo.boundingBox.min.y;p.rotation.y=-.6;
      items.push({obj:p,w:c.petGeo.boundingBox.max.x-c.petGeo.boundingBox.min.x+.6,h:c.petGeo.boundingBox.max.y-c.petGeo.boundingBox.min.y});}});
  if(state.viper)items.push({obj:viperGhost(),w:1.92,h:1.12});
  items.forEach(it=>{if(x)x+=.9;it.obj.position.x+=x+it.w/2;x+=it.w;maxH=Math.max(maxH,it.h);world.add(it.obj);});
  world.position.x=-x/2;
  const span=Math.max(x,4.5);grid=new THREE.GridHelper(Math.ceil(span*2),Math.ceil(span*2)*2,css('--grid'),css('--grid'));scene.add(grid);
  controls.target.set(0,maxH*.4,0);const d=span*1.25+2;camera.position.set(d*.75,maxH*.5+d*.32,d*.85);controls.update();
  scene.background=new THREE.Color(css('--view'));
  document.getElementById('hud').textContent=list.map(c=>`${c.name}: ${c.bodyTris+c.wheelTris} tris`).join(' · ');
  try{localStorage.setItem('cvdcars',JSON.stringify({pick:state.pick,viper:state.viper,pet:state.pet,horn:state.horn,explode:state.explode}));}catch(e){}}

// ---------- UI ----------
const pick=document.getElementById('pick');
[{id:'both',name:'Both cars',blurb:'Side by side',side:''}].concat(CARS).forEach(c=>{const b=document.createElement('button');b.className='pk '+c.side;b.id='pk-'+c.id;b.dataset.id=c.id;
  b.innerHTML=`<b>${c.name}</b><span>${c.blurb}</span>`;b.onclick=()=>{state.pick=c.id;sync();rebuild();};pick.appendChild(b);});
const m2=v=>v.toFixed(2)+' m';
document.getElementById('specs').innerHTML=CARS.map(c=>`<div class="card ${c.side}"><h3>${c.name}</h3><p class="sub"><code>${c.file}</code> · ${c.blurb}</p><dl>
  <dt>Length</dt><dd class="n">${m2(c.size.z)}</dd><dt>Width</dt><dd class="n">${m2(c.size.x)}</dd><dt>Height</dt><dd class="n">${m2(c.size.y)}</dd>
  <dt>Wheelbase</dt><dd class="n">${m2(c.wb)}</dd><dt>Track</dt><dd class="n">${c.track.map(m2).join(' front / ')} rear</dd>
  <dt>Triangles</dt><dd class="n">${c.bodyTris} body + ${c.wheelTris} wheels</dd>
  <dt>Horn</dt><dd>${c.horn}, throws a ${c.hornBall.name.toLowerCase()}</dd><dt>Tune</dt><dd>${c.tune}</dd></dl>
  <ul>${c.notes.map(n=>`<li>${n}</li>`).join('')}</ul></div>`).join('');
function sync(){document.querySelectorAll('.pk').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===state.pick));
  for(const[k,id]of[['viper','optViper'],['pet','optPet'],['horn','optHorn'],['explode','optExplode'],['spin','optSpin']])document.getElementById(id).checked=state[k];}
for(const[k,id]of[['viper','optViper'],['pet','optPet'],['horn','optHorn'],['explode','optExplode']])document.getElementById(id).onchange=e=>{state[k]=e.target.checked;rebuild();};
document.getElementById('optSpin').onchange=e=>{state.spin=e.target.checked;};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',rebuild);
new MutationObserver(rebuild).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(view);
sync();rebuild();resize();
(function loop(){requestAnimationFrame(loop);if(state.spin)world.rotation.y+=.006;controls.update();renderer.render(scene,camera);})();
</script>
