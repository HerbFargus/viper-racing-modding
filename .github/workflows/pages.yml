name: Deploy Library to GitHub Pages

# Publishes the client-side gallery (gallery/) to GitHub Pages. The gallery loads
# vrmod at runtime via Pyodide, so it needs gallery/vrmod.zip -- a build artifact
# that is gitignored, not committed. CI regenerates it from the canonical vrmod/
# on every deploy, so the hosted Library can never drift from the toolkit.

on:
  push:
    branches: [main]
    paths:
      - "gallery/**"
      - "vrmod/**"
      - "scripts/build_gallery.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build gallery/vrmod.zip from the canonical vrmod/
        run: python scripts/build_gallery.py
      - uses: actions/configure-pages@v5
      - name: Upload the gallery as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gallery

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
